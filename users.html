<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rollbux - Active Users</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121418;
      color: #c2c6db;
      margin: 0;
      padding: 0;
    }
    .custom-scroll::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen bg-[#121418] text-[#c2c6db] antialiased selection:bg-[#acff46] selection:text-[#121418]">

  <div class="max-w-[1200px] mx-auto px-4 sm:px-6 lg:px-8 py-10">
    
    <!-- Top Bar -->
    <div class="flex items-center justify-between pb-8 border-b border-white/[0.04]">
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-2 group">
          <img src="https://rollbux.com/icons/token.png" alt="Rollbux" class="size-7 group-hover:rotate-12 transition-transform">
          <span class="text-[22px] font-extrabold italic text-white tracking-wide">ROLLBUX</span>
        </a>
        <span class="text-[13px] text-[#6d7680] font-semibold">/</span>
        <span class="text-[14px] text-[#9aa3a8] font-bold">Tracked Users</span>
      </div>

      <div class="flex items-center gap-3">
        <span id="userCountBadge" class="text-[13px] font-semibold text-[#9aa3a8] bg-[#0e131f] px-3 py-1.5 rounded-lg border border-white/[0.04]">
          Loading users...
        </span>
      </div>
    </div>

    <!-- Header Section -->
    <div class="py-8">
      <h1 class="text-[28px] font-extrabold italic text-white tracking-tight">Active Profiles</h1>
      <p class="text-[14px] text-[#6d7680] mt-1">Select any tracked player to view their live dashboard, rain countdown, balance, and earnings.</p>
    </div>

    <!-- Users Cards Grid: exactly matching the format of the overview cards -->
    <div id="usersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- User cards populated dynamically -->
    </div>

    <!-- Empty State -->
    <div id="emptyUsersState" class="hidden flex-col items-center justify-center py-20 text-center">
      <div class="size-16 rounded-full bg-[#0e131f] border border-white/[0.06] flex items-center justify-center mb-4">
        <img src="https://rollbux.com/icons/token.png" alt="Coin" class="size-8 opacity-40">
      </div>
      <p class="text-[16px] font-bold text-white mb-1">No Tracked Users Yet</p>
      <p class="text-[13px] text-[#6d7680] max-w-sm">Install the Rollbux Rain Tracker Tampermonkey script and open rollbux.com to automatically appear here.</p>
    </div>

  </div>

  <script>
    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        if (!res.ok) return;
        const data = await res.json();
        const usersObj = data.users || {};
        const usernames = Object.keys(usersObj).filter(k => k.toLowerCase() !== 'users');

        const grid = document.getElementById('usersGrid');
        const emptyState = document.getElementById('emptyUsersState');
        const badge = document.getElementById('userCountBadge');

        badge.textContent = `${usernames.length} player${usernames.length === 1 ? '' : 's'}`;

        if (usernames.length === 0) {
          grid.innerHTML = '';
          emptyState.classList.remove('hidden');
          emptyState.classList.add('flex');
          return;
        }

        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');

        grid.innerHTML = usernames.map(key => {
          const user = usersObj[key];
          const name = user.username || key;
          const rainsJoined = user.rains_joined || 0;
          const balance = (user.balance_bux || 0).toLocaleString();
          const pot = user.active_rain && user.active_rain.pot_amount ? user.active_rain.pot_amount.toLocaleString() : '0';

          return `
            <a href="/user/${encodeURIComponent(name)}" class="group block relative">
              <div class="relative flex flex-col items-start gap-[6px] overflow-clip rounded-[12px] px-[20px] py-[16px] border border-white/[0.04] bg-[#0e131f] transition-all hover:border-[#acff46]/30 hover:bg-[#111726]">
                <span aria-hidden="true" class="pointer-events-none absolute inset-0 rounded-[12px] bg-[#0e131f]"></span>
                
                <!-- Card Header with User Label & Badge -->
                <div class="relative z-10 flex w-full items-center justify-between">
                  <p class="text-[14px] font-medium leading-[20px] text-[#9aa3a8] group-hover:text-[#acff46] transition-colors">User</p>
                  <span class="text-[11px] font-semibold text-[#acff46] bg-[rgba(172,255,70,0.1)] px-2 py-0.5 rounded-[5px]">View Dashboard →</span>
                </div>

                <!-- Big Username -->
                <p class="relative z-10 whitespace-nowrap text-[20px] font-bold leading-[30px] text-white group-hover:text-white transition-colors truncate w-full">${name}</p>

                <!-- Sub details -->
                <div class="relative z-10 mt-2 flex items-center gap-4 text-[12px] text-[#6d7680] border-t border-white/[0.03] pt-2.5 w-full">
                  <div>
                    <span class="text-[#9aa3a8] font-medium">Joined:</span>
                    <strong class="text-white ml-1">${rainsJoined} Rains</strong>
                  </div>
                  <div>
                    <span class="text-[#9aa3a8] font-medium">Balance:</span>
                    <strong class="text-[#acff46] ml-1">${balance} BUX</strong>
                  </div>
                </div>

                <span aria-hidden="true" class="pointer-events-none absolute inset-0" style="border-radius: 12px; box-shadow: rgba(114, 144, 231, 0.04) 0px 4px 0px 0px inset;"></span>
              </div>
            </a>
          `;
        }).join('');

      } catch (err) {
        console.error('Error loading users:', err);
      }
    }

    loadUsers();
    setInterval(loadUsers, 3000);
  </script>
</body>
</html>
