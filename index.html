<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rollbux</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <style>body{background:#0b0e14;color:#fff;font-family:Inter,sans-serif}.page-panel{background:#0e131f;min-height:100vh}</style>
</head>
<body class="min-h-screen">
  <main class="page-panel">
    <div class="mx-auto flex min-h-screen w-full max-w-[640px] flex-col px-5 pb-10 pt-7 sm:px-6">
      <header class="flex items-center justify-between gap-4">
        <a href="/" class="text-[23px] font-bold italic tracking-[.5px]">Roll<span class="text-[#acff46]">bux</span></a>
        <div class="flex items-center gap-2">
          <a href="/login" class="rounded-lg border border-white/[0.08] bg-white/[0.04] px-3 py-1.5 text-[11px] font-semibold text-[#c2c6db] transition hover:bg-white/[0.08] hover:text-white">Log in</a>
          <a href="/signup" class="rounded-lg bg-[#acff46] px-3 py-1.5 text-[11px] font-bold text-[#121418] transition hover:bg-[#96e036]">Sign up</a>
        </div>
      </header>

      <section class="flex flex-col items-center justify-center py-16 text-center">
        <div class="flex w-full flex-col items-center justify-center gap-2 sm:flex-row">
          <a href="/signup" class="w-full max-w-[190px] rounded-lg bg-[#acff46] px-4 py-2.5 text-xs font-bold text-[#121418] transition hover:bg-[#96e036]">Create your account</a>
          <a href="/login" class="w-full max-w-[190px] rounded-lg border border-white/[0.08] bg-white/[0.04] px-4 py-2.5 text-xs font-semibold text-white transition hover:bg-white/[0.08]">Log in</a>
        </div>
      </section>

      <section class="grid gap-3 sm:grid-cols-3">
        <div class="rounded-xl border border-white/[0.05] bg-[#131a29] px-4 py-5 text-center"><p class="text-sm font-bold text-white">Auto rain</p></div>
        <div class="rounded-xl border border-white/[0.05] bg-[#131a29] px-4 py-5 text-center"><p class="text-sm font-bold text-white">Auto wager</p></div>
        <div class="rounded-xl border border-white/[0.05] bg-[#131a29] px-4 py-5 text-center"><p class="text-sm font-bold text-white">Safe to use</p></div>
      </section>
    </div>
  </main>
</body>
</html>
