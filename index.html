<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rollbux</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <style>body{background:#121418;background-image:linear-gradient(180deg,#15171d 0%,#101115 100%);color:#fff;font-family:Inter,sans-serif}.card{background:#0e131f;border:1px solid rgba(255,255,255,.04);border-radius:12px}</style>
</head>
<body class="min-h-screen">
  <main class="mx-auto flex w-full max-w-[660px] flex-col px-4 pb-12 pt-9 sm:px-6">
    <header class="flex items-start justify-between gap-4">
      <a href="/" class="text-[25px] font-bold italic tracking-[.5px]">Roll<span class="text-[#acff46]">bux</span></a>
      <div class="flex items-center gap-2 pt-1">
        <a href="/login" class="rounded-lg border border-white/[0.06] bg-white/[0.04] px-3 py-2 text-xs font-semibold text-[#9aa3a8] transition hover:bg-white/[0.08] hover:text-white">Log in</a>
        <a href="/signup" class="rounded-lg bg-[#acff46] px-3 py-2 text-xs font-bold text-[#121418] transition hover:bg-[#96e036]">Sign up</a>
      </div>
    </header>

    <section class="card mt-8 px-5 py-12 text-center sm:px-10">
      <p class="text-xs font-bold uppercase tracking-[.2em] text-[#acff46]">Welcome to Rollbux</p>
      <h1 class="mt-4 text-4xl font-bold italic tracking-tight text-white sm:text-5xl">Play smarter.</h1>
      <p class="mx-auto mt-3 max-w-[420px] text-sm leading-6 text-[#9aa3a8]">Manage your accounts, track rain rewards, and keep your game history in one place.</p>
      <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
        <a href="/signup" class="w-full max-w-[210px] rounded-lg bg-[#acff46] px-5 py-3 text-sm font-bold text-[#121418] transition hover:bg-[#96e036]">Create your account</a>
        <a href="/login" class="w-full max-w-[210px] rounded-lg border border-white/[0.08] bg-white/[0.03] px-5 py-3 text-sm font-semibold text-white transition hover:bg-white/[0.08]">Log in</a>
      </div>
    </section>

    <section class="mt-4 grid gap-3 sm:grid-cols-3">
      <div class="card p-4 text-center"><p class="text-sm font-bold text-white">Rain rewards</p><p class="mt-1 text-xs leading-5 text-[#9aa3a8]">Track your activity.</p></div>
      <div class="card p-4 text-center"><p class="text-sm font-bold text-white">Game history</p><p class="mt-1 text-xs leading-5 text-[#9aa3a8]">Review every play.</p></div>
      <div class="card p-4 text-center"><p class="text-sm font-bold text-white">Your accounts</p><p class="mt-1 text-xs leading-5 text-[#9aa3a8]">Manage your accounts.</p></div>
    </section>
  </main>
</body>
</html>
