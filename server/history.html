<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rollbux - History</title>
  <!-- Suppress cdn.tailwindcss.com console warning -->
  <script>
    (function(){
      const _origWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        _origWarn.apply(console, args);
      };
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0e14;
      background-image: radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.06) 0%, transparent 60%);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body class="selection:bg-[#acff46] selection:text-black antialiased">
  <div class="flex w-full justify-center pb-[60px] pt-[30px]">
    <div class="flex w-full max-w-[1060px] flex-col items-start gap-[22px] px-4 md:px-6">
      
      <!-- Top Navigation & Controls Bar -->
      <div class="flex w-full flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/[0.04] pb-4">
        <div class="flex flex-col items-start gap-1">
          <div class="flex items-center gap-2">
            <a href="/" class="px-3 py-1 bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.06] text-[#9aa3a8] hover:text-white rounded-lg text-xs font-semibold transition active:scale-95 shadow-sm">
              Dashboard
            </a>
            <a href="/accounts" class="px-3 py-1 bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.06] text-[#9aa3a8] hover:text-white rounded-lg text-xs font-semibold transition active:scale-95 shadow-sm">
              Accounts
            </a>
          </div>
          <div class="flex items-center gap-2.5 mt-1">
            <h1 class="whitespace-nowrap text-[24px] tracking-tight text-white font-black italic">Game History</h1>
          </div>
        </div>

        <!-- Controls: Clear Button -->
        <div class="flex items-center gap-3 self-end sm:self-auto">
          <button id="clearHistoryBtn" type="button" class="flex items-center gap-1.5 px-3.5 py-2 rounded-[9px] bg-white/[0.04] hover:bg-red-500/10 border border-white/[0.08] hover:border-red-500/30 text-[#9aa3a8] hover:text-red-400 font-bold text-xs tracking-wide transition active:scale-95 cursor-pointer shadow-sm">
            <svg class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
            </svg>
            <span>Clear History</span>
          </button>
        </div>
      </div>

      <!-- History Table Container (Matches Rains Column Structure) -->
      <div class="flex w-full flex-col items-start gap-[16px]">
        <div class="flex w-full items-center justify-between">
          <p class="whitespace-nowrap text-[20px] leading-[30px] text-white font-bold italic">Rounds</p>
          <span id="historyCountBadge" class="text-[13px] text-[#9aa3a8]">0 rounds</span>
        </div>

        <div class="custom-scroll w-full max-w-full overflow-x-auto overflow-y-hidden">
          <div class="relative w-full min-w-[650px] shrink-0 rounded-[12px] border border-white/[0.03] overflow-hidden" style="min-height: 164px;">
            <span aria-hidden="true" class="pointer-events-none absolute inset-0 rounded-[12px] bg-[#0e131f]"></span>

            <!-- Table Column Headers: Account | Game Mode | Result | Amount | Time -->
            <div class="relative z-10 grid grid-cols-[1fr_1fr_1fr_1fr_1fr] items-center gap-[12px] px-[16px] py-[14px] text-[13px] font-semibold tracking-[0.28px] text-[#9aa3a8] border-b border-white/[0.04]">
              <div>Account</div>
              <div class="text-center">Game Mode</div>
              <div class="text-center">Result</div>
              <div class="text-center">Amount</div>
              <div class="text-right pr-2">Time</div>
            </div>

            <!-- Table Rows Container -->
            <div id="historyList" class="relative z-10 flex flex-col divide-y divide-white/[0.02]">
              <div id="emptyHistory" class="flex h-[120px] items-center justify-center px-[32px] text-center">
                <p class="text-[13px] leading-[20px] text-[#9aa3a8]">No game rounds recorded yet. Auto Upgrader, Battle, and Mines plays will appear here.</p>
              </div>
            </div>

            <span aria-hidden="true" class="pointer-events-none absolute inset-0" style="border-radius: 12px; box-shadow: rgb(66, 66, 66) 0px 2px 0px 0px inset; mix-blend-mode: color-dodge;"></span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUsername = urlParams.get('user') || 'sotarium';

    function getStorageKey() {
      return `rollbux_game_history_${targetUsername.toLowerCase()}`;
    }

    function loadAllHistory() {
      const mainKey = getStorageKey();
      let entries = [];
      try {
        entries = JSON.parse(localStorage.getItem(mainKey) || '[]');
      } catch (e) {}

      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('rollbux_game_history_') && k !== mainKey) {
          try {
            const extra = JSON.parse(localStorage.getItem(k) || '[]');
            if (Array.isArray(extra)) entries.push(...extra);
          } catch (e) {}
        }
      }

      const seen = new Set();
      const unique = [];
      for (const item of entries) {
        const id = `${item.account}_${item.mode}_${item.ts}`;
        if (!seen.has(id)) {
          seen.add(id);
          unique.push(item);
        }
      }

      unique.sort((a, b) => (b.ts || 0) - (a.ts || 0));
      return unique;
    }

    const modeColors = {
      'Upgrader': '#7974FF',
      'Battle': '#f59e0b',
      'Mines': '#ef4444'
    };

    function renderHistory() {
      const list = document.getElementById('historyList');
      const badge = document.getElementById('historyCountBadge');
      if (!list) return;

      const items = loadAllHistory();
      if (badge) {
        badge.textContent = `${items.length} round${items.length === 1 ? '' : 's'}`;
      }

      if (items.length === 0) {
        list.innerHTML = `
          <div class="flex h-[120px] items-center justify-center px-[32px] text-center">
            <p class="text-[13px] leading-[20px] text-[#9aa3a8]">No game rounds recorded yet. Auto Upgrader, Battle, and Mines plays will appear here.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = items.map(entry => {
        const modeColor = modeColors[entry.mode] || '#9aa3a8';
        const isSuccess = Boolean(entry.success);

        // Win badge: green, Loss badge: red
        const resultBadge = isSuccess
          ? `<span class="px-2 py-0.5 rounded bg-[#acff46]/10 border border-[#acff46]/20 text-[11px] font-extrabold text-[#acff46] tracking-wider uppercase">Success</span>`
          : `<span class="px-2 py-0.5 rounded bg-red-500/10 border border-red-500/20 text-[11px] font-extrabold text-red-400 tracking-wider uppercase">Loss</span>`;

        // Format bet and win/loss amount
        const betAmt = entry.betBux ? parseFloat(entry.betBux).toFixed(2) : null;
        const outAmt = entry.amountBux ? parseFloat(entry.amountBux).toFixed(2) : '0.00';
        
        let amtDisplayHtml = '';
        if (betAmt && isSuccess) {
          amtDisplayHtml = `<div class="flex flex-col items-center leading-tight">
            <span class="text-[13px] font-bold text-[#50f07b]">+${outAmt} BUX</span>
            <span class="text-[10px] text-[#9aa3a8]">Bet: ${betAmt}</span>
          </div>`;
        } else if (betAmt && !isSuccess) {
          amtDisplayHtml = `<div class="flex flex-col items-center leading-tight">
            <span class="text-[13px] font-bold text-[#ff6b6b]">-${betAmt} BUX</span>
            <span class="text-[10px] text-[#9aa3a8]">Bet: ${betAmt}</span>
          </div>`;
        } else {
          amtDisplayHtml = `<span class="text-[13px] font-bold text-[#c2c6db]">${outAmt} BUX</span>`;
        }

        const timeDisplay = entry.ts ? new Date(entry.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
        const accName = entry.account || targetUsername;

        return `
          <div class="grid grid-cols-[1fr_1fr_1fr_1fr_1fr] items-center gap-[12px] relative min-h-[56px] px-[16px] py-[10px] transition-colors hover:bg-[rgba(255,255,255,0.02)]" role="row">
            <span class="truncate text-[14px] font-bold italic tracking-[0.3px] text-white">${accName}</span>
            <span class="flex items-center justify-center">
              <span class="text-[13px] font-bold" style="color:${modeColor}">${entry.mode}</span>
            </span>
            <span class="flex items-center justify-center">${resultBadge}</span>
            <span class="flex items-center justify-center">${amtDisplayHtml}</span>
            <span class="flex items-center justify-end pr-2 text-[12px] text-[#9aa3a8]">${timeDisplay}</span>
          </div>
        `;
      }).join('');
    }

    const clearBtn = document.getElementById('clearHistoryBtn');
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const k = localStorage.key(i);
          if (k && k.startsWith('rollbux_game_history_')) {
            localStorage.removeItem(k);
          }
        }
        renderHistory();
      });
    }

    renderHistory();
    setInterval(renderHistory, 3000);
  </script>
</body>
</html>
