<!doctype html>
<html lang="en" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rollbux - Sign up</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet"><script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script><style>body{background:#121418;background-image:linear-gradient(180deg,#15171d 0%,#101115 100%);color:#fff;font-family:Inter,sans-serif}</style></head><body class="min-h-screen flex items-center justify-center px-4 pt-[35px]"><main class="w-full max-w-[520px]"><header class="mb-7 text-center"><a href="/" class="text-[25px] font-bold italic tracking-[.5px]">Roll<span class="text-[#acff46]">bux</span></a><p class="text-[20px] font-bold italic mt-7">Create account</p></header><section class="rounded-[12px] bg-[#0e131f] border border-white/[0.03] p-5 sm:p-6"><form id="form" class="space-y-4"><div><div class="flex items-center justify-between mb-1.5"><label id="identifierLabel" for="identifier" class="text-xs font-semibold text-[#9aa3a8]">Username</label><div class="flex rounded-md bg-[#131a29] p-0.5"><button type="button" id="usernameMode" class="mode px-2.5 py-1 rounded text-[11px] font-bold bg-[#acff46] text-[#121418]">Username</button><button type="button" id="emailMode" class="mode px-2.5 py-1 rounded text-[11px] font-bold text-[#9aa3a8]">Email</button></div></div><input id="identifier" name="identifier" type="text" autocomplete="username" required minlength="5" placeholder="Choose a username" class="w-full rounded-[7px] bg-[#131a29] px-3 py-2.5 text-sm outline-none border border-transparent focus:border-[#acff46]"></div><label class="block"><span class="text-xs font-semibold text-[#9aa3a8]">Password <span class="text-[#6d7680]">(5+ characters)</span></span><input name="password" type="password" minlength="5" autocomplete="new-password" required class="mt-1.5 w-full rounded-[7px] bg-[#131a29] px-3 py-2.5 text-sm outline-none border border-transparent focus:border-[#acff46]"></label><input type="hidden" name="mode" id="mode" value="username"><p id="error" class="hidden text-xs text-red-400"></p><button class="w-full rounded-[7px] bg-[#acff46] py-2.5 text-sm font-bold text-[#121418] hover:bg-[#96e036]">Sign up</button></form><p class="text-center text-xs text-[#6d7680] mt-5">Already have an account? <a href="/login" class="text-[#acff46] hover:underline">Log in</a></p></section></main><script>const form=document.getElementById('form'),identifier=document.getElementById('identifier'),label=document.getElementById('identifierLabel'),mode=document.getElementById('mode'),error=document.getElementById('error'),usernameMode=document.getElementById('usernameMode'),emailMode=document.getElementById('emailMode');function setMode(next){mode.value=next;label.textContent=next==='email'?'Email':'Username';identifier.type=next==='email'?'email':'text';identifier.autocomplete=next==='email'?'email':'username';identifier.placeholder=next==='email'?'you@example.com':'Choose a username';identifier.minLength=next==='email'?0:5;[usernameMode,emailMode].forEach(button=>button.classList.remove('bg-[#acff46]','text-[#121418]'));[usernameMode,emailMode].forEach(button=>button.classList.add('text-[#9aa3a8]'));const active=next==='email'?emailMode:usernameMode;active.classList.add('bg-[#acff46]','text-[#121418]');active.classList.remove('text-[#9aa3a8]')}usernameMode.onclick=()=>setMode('username');emailMode.onclick=()=>setMode('email');form.onsubmit=async e=>{e.preventDefault();error.classList.add('hidden');const r=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();if(!r.ok){error.textContent=d.error||'Unable to create account';error.classList.remove('hidden');return}location.href='/dashboard/'+encodeURIComponent(d.user.username||d.user.email);};</script></body></html>
