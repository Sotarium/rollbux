<!doctype html>
<html lang="en" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rollbux — Create account</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet"><script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script><style>body{background:#121418;color:#fff;font-family:Inter,sans-serif;background-image:linear-gradient(180deg,#15171d,#101115);min-height:100vh}</style></head><body class="min-h-screen flex items-center justify-center p-4"><main class="w-full max-w-[430px]"><div class="mb-8 text-center"><a href="/" class="text-3xl font-bold italic tracking-tight">Roll<span class="text-[#acff46]">bux</span></a><p class="text-sm text-[#9aa3a8] mt-2">Build your own rain dashboard.</p></div><section class="rounded-[14px] bg-[#0e131f] border border-white/[0.05] p-6 sm:p-8 shadow-2xl"><h1 class="text-xl font-bold italic">Create account</h1><p class="text-xs text-[#6d7680] mt-1 mb-6">Use a unique login for your private dashboard.</p><form id="form" class="space-y-4"><label class="block"><span class="text-xs font-semibold text-[#9aa3a8]">Username</span><input name="username" pattern="[A-Za-z0-9_]{3,24}" autocomplete="username" required class="mt-1.5 w-full rounded-lg bg-[#131a29] border border-white/10 px-3 py-2.5 text-sm outline-none focus:border-[#acff46]"></label><label class="block"><span class="text-xs font-semibold text-[#9aa3a8]">Email</span><input name="email" type="email" autocomplete="email" required class="mt-1.5 w-full rounded-lg bg-[#131a29] border border-white/10 px-3 py-2.5 text-sm outline-none focus:border-[#acff46]"></label><label class="block"><span class="text-xs font-semibold text-[#9aa3a8]">Password <span class="text-[#6d7680]">(10+ characters)</span></span><input name="password" type="password" minlength="10" autocomplete="new-password" required class="mt-1.5 w-full rounded-lg bg-[#131a29] border border-white/10 px-3 py-2.5 text-sm outline-none focus:border-[#acff46]"></label><p id="error" class="hidden text-xs text-red-400"></p><button class="w-full rounded-lg bg-[#acff46] py-2.5 text-sm font-bold text-[#121418] hover:bg-[#96e036]">Create account</button></form><p class="text-center text-xs text-[#6d7680] mt-6">Already registered? <a href="/login" class="text-[#acff46] font-semibold hover:underline">Log in</a></p></section></main><script>form.addEventListener('submit',async e=>{e.preventDefault();error.classList.add('hidden');const r=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();if(!r.ok){error.textContent=d.error||'Unable to create account';error.classList.remove('hidden');return}location.href='/';});</script></body></html>
