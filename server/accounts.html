<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rollbux - My Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <style>
    body{background:#121418;background-image:linear-gradient(180deg,#15171d 0%,#101115 100%);color:#fff;font-family:Inter,sans-serif}
    .card{background:#0e131f;border:1px solid rgba(255,255,255,.04);border-radius:4px}
  </style>
</head>
<body class="min-h-screen">
  <main class="mx-auto flex w-full max-w-[660px] flex-col px-4 pb-12 pt-9 sm:px-6">
    <header class="flex items-start justify-between gap-4">
      <div>
        <a href="/dashboard/user" class="text-[25px] font-bold italic tracking-[.5px]">Roll<span class="text-[#acff46]">bux</span></a>
        <p class="mt-7 text-[21px] font-bold italic">My Account</p>
        <p class="mt-1 text-sm text-[#9aa3a8]">Your personal Rollbux account and activity.</p>
      </div>
      <div class="flex items-center gap-2 pt-1">
        <button id="addAccountBtn" type="button" class="rounded-lg bg-[#acff46] px-3 py-2 text-xs font-bold text-[#121418] transition hover:bg-[#96e036]">Add Account</button>
        <button id="logoutBtn" type="button" class="rounded-lg border border-white/[0.06] bg-white/[0.04] px-3 py-2 text-xs font-semibold text-[#9aa3a8] transition hover:bg-white/[0.08] hover:text-white">Log out</button>
      </div>
    </header>

    <section class="card mt-6 min-h-[100px] px-5 py-6 text-center">
      <h2 class="text-[17px] font-bold text-white">Accounts</h2>
      <div id="connectedAccounts" class="mt-3 space-y-2 text-sm text-[#9aa3a8]">
        <p>Loading accounts...</p>
      </div>
    </section>
  </main>

  <script>
    const connectedAccounts = document.getElementById('connectedAccounts');

    async function loadConnectedAccounts() {
      try {
        const response = await fetch('/api/account/accounts', { credentials: 'include' });
        if (response.status === 401) {
          window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
          return;
        }
        if (!response.ok) throw new Error('Unable to load accounts');
        const data = await response.json();
        const accounts = data.accounts || [];
        connectedAccounts.innerHTML = accounts.length ? accounts.map(account => `
          <div class="mx-auto flex max-w-[520px] items-center justify-between rounded-lg bg-[#131a29] px-4 py-3 text-left text-xs">
            <span class="font-semibold text-white">${account.name}</span>
            <div class="flex items-center gap-3"><span class="font-mono text-[#9aa3a8]">${account.token_preview || 'Connected'}</span><button type="button" data-account-id="${account.id}" class="remove-account text-red-400 hover:text-red-300">Remove</button></div>
          </div>`).join('') : '<p>No accounts.</p>';
        document.querySelectorAll('.remove-account').forEach(button => button.addEventListener('click', async () => {
          await fetch('/api/account/accounts', { method: 'DELETE', credentials: 'include', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id: button.dataset.accountId }) });
          loadConnectedAccounts();
        }));
      } catch (error) {
        connectedAccounts.innerHTML = `<p>${error.message}</p>`;
      }
    }

    document.getElementById('addAccountBtn').addEventListener('click', async () => {
      const name = window.prompt('Account name');
      if (!name) return;
      const token = window.prompt('Rollbux session token');
      if (!token) return;
      const response = await fetch('/api/account/accounts', { method: 'POST', credentials: 'include', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, token }) });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        window.alert(data.error || 'Unable to add account');
        return;
      }
      loadConnectedAccounts();
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login';
    });

    loadConnectedAccounts();
  </script>
</body>
</html>
