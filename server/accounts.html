<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rollbux - Player Accounts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #121418;
      background-image: linear-gradient(180deg, #15171d 0%, #101115 100%);
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    .purple-btn {
      background: #7c3aed;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .purple-btn:hover {
      background: #6d28d9;
    }
    .custom-scroll::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #1c2538;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="selection:bg-[#a855f7] selection:text-white">
  <div class="flex w-full justify-center pb-[50px] pt-[35px]">
    <div class="flex w-full max-w-[1536px] flex-col items-start gap-[28px] px-4 md:px-8">
      
      <!-- Top Bar: Dashboard button & Player Accounts beneath it + Add Account Button -->
      <div class="flex w-full items-start justify-between">
        <div class="flex flex-col items-start gap-1">
          <a href="/" class="px-3 py-1.5 bg-white/5 hover:bg-white/10 border border-white/5 text-[#9aa3a8] hover:text-white rounded-lg text-xs font-semibold transition active:scale-95 shadow-sm">
            Dashboard
          </a>
          <h1 class="whitespace-nowrap text-[25px] tracking-[0.5px] text-white font-bold italic mt-1">Player Accounts</h1>
        </div>

        <!-- Clean Purple Add Account Button -->
        <button id="openAddModalBtn" type="button" class="purple-btn flex items-center gap-2 px-5 py-2.5 rounded-[10px] text-white font-bold text-xs tracking-wide transition active:scale-95 cursor-pointer mt-1">
          <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          <span>Add Account</span>
        </button>
      </div>

      <!-- Section Title & Counter -->
      <div class="flex w-full items-center justify-between">
        <p class="whitespace-nowrap text-[20px] leading-[30px] text-white font-bold italic">Accounts</p>
        <span id="accountCountBadge" class="text-[13px] text-[#9aa3a8]">0 accounts</span>
      </div>

      <!-- Accounts Table: User column only + Status + Action -->
      <div class="w-full flex flex-col items-center gap-[12px]">
        <div class="custom-scroll w-full max-w-full overflow-x-auto overflow-y-hidden">
          <div class="relative w-full shrink-0 rounded-[12px] border border-white/[0.03] overflow-hidden" style="min-height: 164px;">
            <span aria-hidden="true" class="pointer-events-none absolute inset-0 rounded-[12px] bg-[#0e131f]"></span>

            <!-- Table Column Headers: User | Balance | Messages | Rain Status | Action -->
            <div class="relative z-10 grid grid-cols-[1fr_100px_100px_110px_40px] items-center gap-[12px] px-[16px] py-[14px] text-[13px] font-semibold tracking-[0.28px] text-[#9aa3a8] border-b border-white/[0.04]">
              <div>User</div>
              <div class="text-right">Balance</div>
              <div class="text-center">Messages</div>
              <div class="text-center">Rain Status</div>
              <div class="text-center"></div>
            </div>

            <!-- Table Rows Container -->
            <div id="accountsList" class="relative z-10 flex flex-col divide-y divide-white/[0.02]">
              <div id="loadingState" class="flex h-[120px] items-center justify-center px-[32px] text-center">
                <p class="text-[13px] text-[#9aa3a8]">Loading accounts...</p>
              </div>
            </div>

            <span aria-hidden="true" class="pointer-events-none absolute inset-0" style="border-radius: 12px; box-shadow: rgb(66, 66, 66) 0px 2px 0px 0px inset; mix-blend-mode: color-dodge;"></span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Add Account Modal -->
  <div id="addModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="w-full max-w-md rounded-[16px] bg-[#0e131f] border border-white/[0.08] p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-white/[0.06] pb-3">
        <h3 class="text-base font-bold text-white italic">Add Player Account</h3>
        <button id="closeAddModalBtn" class="text-gray-400 hover:text-white text-lg font-bold">&times;</button>
      </div>

      <p class="text-xs text-[#9aa3a8] leading-relaxed">
        Paste the RollBux account nickname and its <code class="text-white bg-white/10 px-1 py-0.5 rounded font-mono">authjs.session-token</code> cookie or JWT.
      </p>

      <form id="addAccountForm" class="space-y-4">
        <div>
          <label class="block text-[11px] font-semibold text-gray-400 uppercase mb-1">Account Nickname</label>
          <input type="text" id="accNameInput" placeholder="e.g. Dracko" required class="w-full bg-[#131a29] border border-white/10 rounded-[8px] px-3 py-2 text-xs text-white focus:outline-none focus:border-[#a855f7]">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-gray-400 uppercase mb-1">Session Token (Cookie or JWT)</label>
          <input type="password" id="accTokenInput" placeholder="eyJhbGciOiJIUzI1Ni..." required class="w-full bg-[#131a29] border border-white/10 rounded-[8px] px-3 py-2 text-xs text-white focus:outline-none focus:border-[#a855f7] font-mono">
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-white/[0.06]">
          <button type="button" id="cancelAddModalBtn" class="px-4 py-2 text-xs font-semibold text-gray-400 hover:text-white transition">Cancel</button>
          <button type="submit" id="saveAccountBtn" class="purple-btn px-5 py-2 font-bold text-xs rounded-[8px] transition active:scale-95 text-white">Save Account</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let registeredAccounts = [];
    let liveStatusMap = {};
    let usersDataMap = {};

    // Avatar ring color palette (matching RollBux avatar rings)
    const ringColors = [
      '#10b981', // emerald
      '#f59e0b', // amber
      '#ef4444', // red
      '#3b82f6', // blue
      '#8b5cf6', // purple
      '#06b6d4', // cyan
      '#acff46'  // lime
    ];

    function getAvatarRingColor(name) {
      let hash = 0;
      for (let i = 0; i < (name || '').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      const idx = Math.abs(hash) % ringColors.length;
      return ringColors[idx];
    }

    async function fetchAll() {
      try {
        const [accRes, statusRes, usersRes] = await Promise.all([
          fetch('/api/roach/accounts'),
          fetch('/api/roach/status'),
          fetch('/api/users')
        ]);

        if (accRes.ok) {
          const data = await accRes.json();
          registeredAccounts = data.accounts || [];
        }

        if (statusRes.ok) {
          const sData = await statusRes.json();
          liveStatusMap = {};
          (sData?.status?.accounts || []).forEach(a => {
            liveStatusMap[(a.name || '').toLowerCase()] = a;
          });
        }

        if (usersRes.ok) {
          const uData = await usersRes.json();
          usersDataMap = uData.users || {};
        }

        renderAccounts();
      } catch (err) {
        console.error('Error fetching accounts:', err);
      }
    }

    function formatNumber(num) {
      const val = parseFloat(num) || 0;
      return val.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function renderAccounts() {
      const list = document.getElementById('accountsList');
      const badge = document.getElementById('accountCountBadge');

      if (badge) badge.textContent = `${registeredAccounts.length} account${registeredAccounts.length === 1 ? '' : 's'}`;

      if (registeredAccounts.length === 0) {
        list.innerHTML = `
          <div class="flex h-[120px] items-center justify-center px-[32px] text-center">
            <p class="text-[13px] leading-[20px] text-[#9aa3a8]">No accounts registered yet. Click <span class="text-[#a855f7] font-bold">+ Add Account</span> above to register an account.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = registeredAccounts.map(a => {
        const nameLower = (a.name || '').toLowerCase();
        const live = liveStatusMap[nameLower] || {};
        const userDb = usersDataMap[nameLower] || {};
        const ringColor = getAvatarRingColor(a.name);
        const isJoined = live.joined === true;
        const chatCount = live.chat_count !== undefined ? live.chat_count : 0;
        const balanceBux = userDb.balance_bux !== undefined ? userDb.balance_bux : 0;

        let statusBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-white/5 text-gray-400 border border-white/5">Waiting</span>';
        if (isJoined) {
          statusBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-green-950/80 text-[#acff46] border border-[#acff46]/30">Joined 🎉</span>';
        } else if (live.join_status && live.join_status.startsWith('FAILED')) {
          statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-red-950/60 text-red-400 border border-red-500/30 font-mono">${live.join_status.split(' ')[0]}</span>`;
        } else if (chatCount >= 3) {
          statusBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-[#8b5cf6]/20 text-[#a78bfa] border border-[#8b5cf6]/30">Ready (< 60s)</span>';
        }

        const chatBadge = `<span class="text-[12px] font-black tracking-tight ${chatCount >= 3 ? 'text-[#acff46]' : 'text-gray-300'}">${chatCount} / 3</span>`;

        return `
          <div class="grid grid-cols-[1fr_100px_100px_110px_40px] items-center gap-[12px] relative min-h-[58px] px-[16px] py-[8px] transition-colors hover:bg-[rgba(255,255,255,0.02)] group" role="row">
            
            <!-- User Column: Avatar ring + username -->
            <a href="/user/${encodeURIComponent(a.name)}" class="flex items-center gap-2.5 min-w-0 group/user">
              <span class="size-[30px] rounded-full flex items-center justify-center shrink-0 border-2 overflow-hidden bg-[#131a29]" style="border-color: ${ringColor};">
                <img src="${userDb.avatar || 'https://rollbux.com/icons/token.png'}" alt="" class="size-full object-cover" onerror="this.onerror=null; this.src='https://rollbux.com/icons/token.png';">
              </span>
              <span class="truncate text-[14px] font-bold text-white group-hover/user:text-[#a855f7] transition-colors">
                ${a.name}
              </span>
            </a>

            <!-- Balance Column -->
            <div class="text-right">
              <span class="text-[13px] font-bold text-white font-mono">${formatNumber(balanceBux)}</span>
              <span class="text-[10px] text-[#9aa3a8] ml-0.5">BUX</span>
            </div>

            <!-- Messages Column -->
            <div class="flex items-center justify-center">
              ${chatBadge}
            </div>

            <!-- Rain Status Column -->
            <div class="flex items-center justify-center">
              ${statusBadge}
            </div>

            <!-- Delete Action -->
            <div class="flex items-center justify-center">
              <button onclick="deleteAccount('${a.id}', '${a.name}')" title="Delete account" class="flex items-center justify-center size-[26px] rounded-[6px] text-gray-500 hover:text-[#ff4b4b] hover:bg-[#ff4b4b]/10 transition active:scale-90">
                <svg class="size-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

          </div>
        `;
      }).join('');
    }

    async function deleteAccount(id, name) {
      if (!confirm(`Are you sure you want to remove account "${name}"?`)) return;
      try {
        const res = await fetch('/api/roach/accounts', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        if (res.ok) {
          await fetchAll();
        } else {
          alert('Failed to remove account.');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    // Modal controls
    const modal = document.getElementById('addModal');
    const openBtn = document.getElementById('openAddModalBtn');
    const closeBtn = document.getElementById('closeAddModalBtn');
    const cancelBtn = document.getElementById('cancelAddModalBtn');
    const form = document.getElementById('addAccountForm');

    openBtn.addEventListener('click', () => {
      form.reset();
      modal.classList.remove('hidden');
      document.getElementById('accNameInput').focus();
    });

    closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
    cancelBtn.addEventListener('click', () => modal.classList.add('hidden'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('accNameInput').value.trim();
      let token = document.getElementById('accTokenInput').value.trim();
      if (!name || !token) return;

      const cookieMatch = token.match(/(?:__Secure-)?authjs\.session-token\s*=\s*([^\s;]+)/i);
      if (cookieMatch && cookieMatch[1]) token = cookieMatch[1].trim();
      const jwtMatch = token.match(/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}/);
      if (jwtMatch) token = jwtMatch[0];

      const saveBtn = document.getElementById('saveAccountBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        const res = await fetch('/api/roach/accounts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, token })
        });

        if (res.ok) {
          modal.classList.add('hidden');
          form.reset();
          await fetchAll();
        } else {
          const errData = await res.json();
          alert('Error: ' + (errData.error || 'Failed to save account'));
        }
      } catch (err) {
        alert('Save error: ' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Account';
      }
    });

    fetchAll();
    setInterval(fetchAll, 3000);
  </script>
</body>
</html>
